name: APK build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK fordítása
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Release APK fordítása (kisebb méret)
        continue-on-error: true
        run: ./gradlew --no-daemon assembleRelease

      - name: APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: NutriNaplo-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Letölthető kiadás (Releases) frissítése
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk NutriNaplo.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk NutriNaplo.apk
          fi
          gh release delete latest -y --cleanup-tag || true
          gh release create latest NutriNaplo.apk \
            --title "NutriNapló – legújabb verzió" \
            --notes "Töltsd le a NutriNaplo.apk fájlt a telefonodra, és koppints rá a telepítéshez. Build: ${{ github.sha }}" \
            --target "${{ github.sha }}"
